[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "cat-health-signals"
version = "0.1.0"
requires-python = ">=3.11"
description = "Deterministic feline observation signals, without diagnostic claims"
license = "Apache-2.0"
[tool.setuptools.packages.find]
include = ["cat_health_signals*"]
