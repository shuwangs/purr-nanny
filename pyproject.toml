[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-nanny-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "boto3>=1.40,<2", "uvicorn>=0.34,<1", "python-dotenv>=1.2,<2", "httpx>=0.28,<1", "cat-health-signals>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["server*", "storage*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
web = ["chat/*.css", "chat/*.js", "chat/*.html"]
"web.cards" = ["*.css", "*.js"]
